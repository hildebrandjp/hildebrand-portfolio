<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}" />
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            background: #070512;
            overflow-x: hidden;
            font-family: 'Courier New', Courier, monospace;
            scrollbar-width: none;
            cursor: none;
        }

        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

        #am-canvas-wrapper {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        #am-scroll-driver {
            position: relative;
            z-index: 1;
            height: 900vh;
            pointer-events: none;
        }

        #am-hud {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            pointer-events: none;
        }

        .am-back-btn {
            pointer-events: all;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.45rem 1rem;
            background: rgba(129, 140, 248, 0.08);
            border: 1px solid rgba(129, 140, 248, 0.4);
            border-radius: 999px;
            color: #818cf8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-decoration: none;
            transition: background 200ms ease, border-color 200ms ease;
        }

        .am-back-btn:hover {
            background: rgba(129, 140, 248, 0.18);
            border-color: rgba(129, 140, 248, 0.85);
        }

        #am-section-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.18em;
            color: rgba(129, 140, 248, 0.7);
            text-transform: uppercase;
        }

        #am-progress-track {
            position: fixed;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .am-progress-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(129, 140, 248, 0.25);
            border: 1px solid rgba(129, 140, 248, 0.4);
            transition: background 300ms ease, transform 300ms ease;
        }

        .am-progress-dot.active {
            background: #818cf8;
            box-shadow: 0 0 8px rgba(129, 140, 248, 0.8);
            transform: scale(1.4);
        }

        #am-scroll-hint {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.4rem;
            opacity: 1;
            transition: opacity 600ms ease;
            pointer-events: none;
        }

        #am-scroll-hint.hidden { opacity: 0; }

        .am-scroll-hint-text {
            font-size: 10px;
            letter-spacing: 0.18em;
            color: rgba(129, 140, 248, 0.5);
            text-transform: uppercase;
        }

        .am-scroll-hint-arrow {
            width: 1px;
            height: 28px;
            background: linear-gradient(to bottom, rgba(0,255,65,0.5), transparent);
            animation: am-pulse-down 1.4s ease-in-out infinite;
        }

        #am-section-continue-card {
            position: fixed;
            left: 1.5rem;
            bottom: 1.5rem;
            z-index: 10;
            max-width: min(320px, calc(100vw - 3rem));
            padding: 0.9rem 1rem;
            background: rgba(7, 5, 18, 0.78);
            border: 1px solid rgba(129, 140, 248, 0.45);
            border-radius: 6px;
            color: rgba(228, 232, 255, 0.78);
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            line-height: 1.5;
            transition: opacity 240ms ease, transform 240ms ease;
            pointer-events: none;
        }

        #am-section-continue-card.hidden {
            opacity: 0;
            transform: translateY(8px);
        }

        @keyframes am-pulse-down {
            0%, 100% { opacity: 0.4; transform: scaleY(0.8); }
            50% { opacity: 1; transform: scaleY(1); }
        }

        #am-glob-profile {
            position: fixed;
            bottom: 2.5rem;
            right: 3rem;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 1.2rem;
            pointer-events: none;
        }

        .am-glob-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 2px solid rgba(129,140,248,0.55);
            object-fit: cover;
        }

        .am-glob-name {
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: #a5b4fc;
        }

        .am-glob-title {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: rgba(228,232,255,0.65);
            margin-top: 4px;
        }

        .am-glob-loc {
            font-family: 'Courier New', Courier, monospace;
            font-size: 10px;
            letter-spacing: 0.08em;
            color: rgba(129,140,248,0.5);
            margin-top: 3px;
        }

        @media (max-width: 600px) {
            #am-progress-track { display: none; }
        }

        #am-cursor {
            position: fixed;
            top: 0; left: 0;
            width: 10px;
            height: 18px;
            background: #4ade80;
            pointer-events: none;
            z-index: 9999;
            opacity: 0;
            animation: am-cur-blink 1s step-end infinite;
        }

        @keyframes am-cur-blink {
            0%, 100% { opacity: 0.85; }
            50%       { opacity: 0.40;    }
        }
    </style>
</head>
<body>
    {{ content }}
    <div id="am-cursor" style="opacity:0"></div>
    <script>
        (function () {
            var el = document.getElementById('am-cursor');
            var ready = false;
            document.addEventListener('mousemove', function (e) {
                el.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
                if (!ready) { el.style.removeProperty('opacity'); ready = true; }
            });
            document.addEventListener('mouseleave', function () { el.style.opacity = '0'; });
            document.addEventListener('mouseenter', function () { if (ready) el.style.removeProperty('opacity'); });
        })();
    </script>
    <script src="/assets/js/dist/amaze-me.js"></script>
</body>
</html>
